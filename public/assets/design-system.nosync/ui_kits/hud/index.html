<!-- @dsCard group="Game HUD" viewport="1280x720" name="In-game HUD" subtitle="The full pixel overlay over the isometric world — pick a tool, gather" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Naevyr — HUD</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--bg-world); overflow: hidden; }
  #stage { position: fixed; inset: 0; image-rendering: pixelated; }
  /* faint corruption fog + cold moonlight vignette over the world */
  #stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(168,85,247,.10) 0%, transparent 45%),
      radial-gradient(140% 120% at 50% 120%, rgba(10,8,16,.85) 0%, transparent 55%);
  }
  .hint {
    position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 20;
    font: 400 10px/1 var(--font-pixel); letter-spacing: .12em; color: var(--bone-45);
    text-transform: uppercase; text-shadow: var(--text-shadow-hud); pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<div class="hint">Pick a tool · 1–6 · then Gather</div>
<script type="text/babel" src="Scene.jsx"></script>
<script type="text/babel" src="Hud.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <>
        <IsoScene driftPct={42} />
        <HUD />
      </>
    );
  }
  // keyboard 1–6 selects hotbar (handled inside HUD via its own state; wire a custom event)
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
