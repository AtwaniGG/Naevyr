<!-- @dsCard group="Type" viewport="700x220" name="Display · Pixelify Sans" subtitle="The bitmap letterform — wordmark, headings, the season name" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); image-rendering: pixelated; }
  .meta { font: 400 10px/1 var(--font-pixel); letter-spacing: .1em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
  .big { font-family: var(--font-display); font-weight: 700; color: var(--text-primary); line-height: 1.05; margin: 0 0 14px; }
  .accent { color: var(--drift-corrupt); }
</style>
</head>
<body>
  <div class="meta">font-display · Pixelify Sans · 700</div>
  <div class="big" style="font-size:56px">NAE<span class="accent">VYR</span></div>
  <div class="big" style="font-size:30px">Season of Ashfall</div>
  <div class="big" style="font-size:20px;font-weight:500;color:var(--text-secondary)">Woodcutting · Mining · Fishing</div>
</body>
</html>
