<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="8px grid — dense game UI lands mostly on 8 and 12px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--bg-app); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { width: 22px; background: var(--drift-corrupt); box-shadow: 0 0 0 1px var(--corrupt-55); }
  .tok { font: 500 10px/1 var(--font-num); color: var(--text-muted); }
  .px { font: 400 10px/1 var(--font-pixel); color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="row" id="r"></div>
  <script>
    const steps = [['1',2],['2',4],['3',8],['4',12],['5',16],['6',20],['7',24],['8',32],['9',40],['10',48],['12',64]];
    document.getElementById('r').innerHTML = steps.map(([n,px]) =>
      `<div class="item"><div class="bar" style="height:${px}px"></div><span class="px">${px}</span><span class="tok">sp-${n}</span></div>`
    ).join('');
  </script>
</body>
</html>
