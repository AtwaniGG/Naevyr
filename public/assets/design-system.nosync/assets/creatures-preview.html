<!-- @dsCard group="World Art" viewport="1100x640" name="Creatures — full set" subtitle="Husk · Stalker · Colossus · Raider — 5 facings, animations cycling live" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Naevyr — Creatures</title>
<style>
  body { margin: 0; padding: 24px; background: #0a0810; font-family: monospace; color: #d8cfe0; }
  h1 { font-size: 18px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 2px; }
  .lede { font-size: 11px; color: rgba(216,207,224,.45); margin: 0 0 20px; letter-spacing: .04em; }
  .beast { margin: 0 0 30px; border-top: 1px solid rgba(168,85,247,.25); padding-top: 12px; }
  .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .head h2 { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
  .head .meta { font-size: 10px; color: rgba(216,207,224,.55); }
  .head .hurt { font-size: 10px; color: #ef4444; }
  .grid { display: grid; gap: 10px; align-items: center; }
  .cap { font-size: 10px; color: rgba(216,207,224,.6); letter-spacing: .04em; }
  .facelabel { font-size: 10px; color: #a855f7; }
  .cell { background: #14101e; box-shadow: inset 1px 1px 0 0 rgba(10,8,16,.9), inset -1px -1px 0 0 rgba(58,51,80,.7);
    position: relative; image-rendering: pixelated; background-repeat: no-repeat; }
  .cell .bar { position: absolute; top: 2px; left: 4px; right: 4px; height: 2px; background: rgba(220,38,38,.5); }
</style>
</head>
<body>
  <h1>Naevyr — Creature Set</h1>
  <p class="lede">Rect-grid pixel sprites · locked RAMP · 1px void outline · 5 facings (engine mirrors w/sw/nw) · top 4px reserved for HP bar (red line). Animations play live.</p>
  <div id="root"></div>

  <script>
  const S = 3;
  const FACINGS = ['s','se','e','ne','n'];
  const FPS = { idle:2, skitter:8, walk:8, stalk:8, lunge:10, slam:10, slash:10, death:6 };
  const CFG = {
    husk:     { cell:[32,32], hurt:'drift-hi #d8b4fe',         anims:[['idle',2],['skitter',4],['lunge',4],['death',3]] },
    stalker:  { cell:[36,40], hurt:'blood-hi #ef4444',         anims:[['idle',2],['stalk',6],['lunge',4],['death',4]] },
    colossus: { cell:[64,64], hurt:'bone-hi #efe9f4 → drift-hi',anims:[['idle',2],['walk',4],['slam',5],['death',5]] },
    raider:   { cell:[32,40], hurt:'blood-hi #ef4444',         anims:[['idle',2],['walk',6],['slash',4],['death',3]] },
  };
  const style = document.createElement('style'); document.head.appendChild(style);
  const root = document.getElementById('root');
  let kf = 0;

  Object.keys(CFG).forEach(name => {
    const spec = CFG[name]; const [cw, ch] = spec.cell;
    const cw3 = cw * S, ch3 = ch * S;
    const totalCols = spec.anims.reduce((a, x) => a + x[1], 0);
    const sheetW = totalCols * cw3;

    const wrap = document.createElement('div'); wrap.className = 'beast';
    wrap.innerHTML = '<div class="head"><h2>' + name + '</h2>' +
      '<span class="meta">cell ' + cw + '×' + ch + ' · anchor ' + (cw >> 1) + ',' + (ch - 1) + ' · ' + totalCols + ' frames/facing</span>' +
      '<span class="hurt">hurt-flash → ' + spec.hurt + '</span></div>';
    const grid = document.createElement('div'); grid.className = 'grid';
    grid.style.gridTemplateColumns = '26px repeat(' + spec.anims.length + ', ' + cw3 + 'px)';
    grid.appendChild(document.createElement('div'));
    spec.anims.forEach(([a, n]) => { const h = document.createElement('div'); h.className = 'cap'; h.textContent = a + ' ' + n + 'f'; grid.appendChild(h); });

    FACINGS.forEach((fc, r) => {
      const fl = document.createElement('div'); fl.className = 'facelabel'; fl.textContent = fc.toUpperCase(); grid.appendChild(fl);
      let startCol = 0;
      spec.anims.forEach(([anim, n]) => {
        const cell = document.createElement('div'); cell.className = 'cell';
        cell.style.width = cw3 + 'px'; cell.style.height = ch3 + 'px';
        cell.style.backgroundImage = "url('_gen/sheet_" + name + ".png')";
        cell.style.backgroundSize = sheetW + 'px auto';
        const dur = (n / FPS[anim]).toFixed(3);
        const x0 = -(startCol * cw3), x1 = -((startCol + n) * cw3), yy = -(r * ch3);
        const an = 'a' + (kf++);
        style.sheet.insertRule('@keyframes ' + an + '{from{background-position:' + x0 + 'px ' + yy + 'px}to{background-position:' + x1 + 'px ' + yy + 'px}}', style.sheet.cssRules.length);
        cell.style.animation = an + ' ' + dur + 's steps(' + n + ') infinite';
        const bar = document.createElement('div'); bar.className = 'bar'; cell.appendChild(bar);
        grid.appendChild(cell);
        startCol += n;
      });
    });
    wrap.appendChild(grid); root.appendChild(wrap);
  });
  </script>
</body>
</html>
