<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px;
    background: repeating-linear-gradient(135deg, #1c1728 0 12px, #171320 12px 24px), var(--bg-world); }
  .wrap { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .lbl { font: 400 10px/1 var(--font-pixel); letter-spacing: .1em; color: var(--text-muted); text-transform: uppercase; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
  const { Panel, Button, Badge, SeasonBadge, Icon } = window.DriftLandsDesignSystem_3de3e2;
  function Demo() {
    return (
      <div className="wrap">
        <div className="col">
          <div className="row"><span className="lbl">Buttons</span></div>
          <div className="row">
            <Button variant="primary" iconLeft={<Icon name="axe" size={16} />}>Gather</Button>
            <Button variant="gold" iconLeft={<Icon name="coin" size={16} />}>Claim</Button>
          </div>
          <div className="row">
            <Button variant="ghost" size="sm">Drop</Button>
            <Button variant="danger" size="sm">Destroy</Button>
            <Button variant="primary" size="sm" disabled>Locked</Button>
          </div>
          <div className="row" style={{ marginTop: 4 }}><span className="lbl">Badges</span></div>
          <div className="row">
            <Badge tone="corrupt">Drift</Badge>
            <Badge tone="gold">Epic</Badge>
            <Badge tone="success">Safe</Badge>
            <Badge tone="warning">Decay</Badge>
            <Badge tone="danger" icon={<Icon name="heart" size={12} />}>Low</Badge>
          </div>
          <div className="row" style={{ marginTop: 4 }}><span className="lbl">Season badge</span></div>
          <SeasonBadge season={3} name="Ashfall" driftPct={42} />
        </div>
        <Panel kicker="Wayfarer" title="Field Notes" accessory={<Badge tone="neutral">III</Badge>} style={{ width: 250 }} glow>
          <p style={{ margin: 0, font: '400 13px/1.55 var(--font-ui)', color: 'var(--text-secondary)' }}>
            The node will re-form elsewhere by nightfall. Mark it and move on.
          </p>
          <div className="row" style={{ marginTop: 12 }}>
            <Button variant="primary" size="sm" block>Track node</Button>
          </div>
        </Panel>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
