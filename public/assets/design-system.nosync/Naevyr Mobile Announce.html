<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naevyr — Mobile + Guest Rift announce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; }
  #root { position: fixed; inset: 0; }
  * { box-sizing: border-box; }
  img { image-rendering: pixelated; -ms-interpolation-mode: nearest-neighbor; }
  /* clean capture mode (open with #clean) — hides the scrubber for a pristine 16:9 record */
  body.clean #root > div > div:last-child { display: none !important; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    // #clean (or ?clean) hides the scrubber so a screen-recording is a clean 16:9 loop
    if (location.hash.indexOf('clean') > -1 || location.search.indexOf('clean') > -1) {
      document.body.classList.add('clean');
    }
  </script>
  <script type="text/babel" src="animations.jsx"></script>
  <script type="text/babel" src="naevyr_scenes.jsx"></script>
  <script type="text/babel">
    const { Stage } = window;
    ReactDOM.createRoot(document.getElementById('root')).render(
      <Stage width={1920} height={1080} duration={6} background="#0a0810" loop={true} persistKey="naevyr-announce">
        <window.NaevyrAnnounce />
      </Stage>
    );
  </script>
</body>
</html>
