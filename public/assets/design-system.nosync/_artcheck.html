<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  body{margin:0;background:#0a0810;font-family:monospace;color:#a855f7;padding:20px}
  .row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;margin-bottom:28px}
  .cell{display:flex;flex-direction:column;gap:6px}
  .cell span{font-size:11px;color:#9a90a8}
  .box{image-rendering:pixelated;background:#14101e;box-shadow:inset 0 0 0 1px #2a2438}
  img{image-rendering:pixelated;display:block}
  .vista{width:480px;height:270px;overflow:hidden;position:relative}
  .vista img{position:absolute;left:0;top:0;width:960px;height:540px}
</style></head><body>
  <div class="row">
    <div class="cell"><span>hero_vista frame 0 (480×270 of 960 sheet) ×2</span>
      <div class="vista box"><img src="assets/landing/hero_vista.svg"></div></div>
  </div>
  <div class="row">
    <div class="cell"><span>logo-horizontal 512×96 ×1.4</span><img class="box" src="assets/brand/logo-horizontal.svg" style="width:716px;height:134px"></div>
  </div>
  <div class="row">
    <div class="cell"><span>emblem-64 ×3</span><img class="box" src="assets/brand/emblem-64.svg" style="width:192px;height:192px"></div>
    <div class="cell"><span>logo-stacked ×1.5</span><img class="box" src="assets/brand/logo-stacked.svg" style="width:384px"></div>
    <div class="cell"><span>drift_crystal ×4</span><img class="box" src="assets/frontier/drift_crystal.svg" style="height:176px"></div>
    <div class="cell"><span>drift_wall ×2</span><img class="box" src="assets/threshold/drift_wall.svg" style="height:200px"></div>
  </div>
  <div class="row">
    <div class="cell"><span>wordmark_plate (landing) ×1.5</span><img class="box" src="assets/landing/wordmark_plate.svg" style="width:auto;height:200px"></div>
  </div>
</body></html>
