<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Naevyr — Camp Bosses</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&family=Silkscreen&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#06040a;font-family:'Sora',sans-serif}canvas{display:block}</style>
</head><body>
<script src="reel-common.js"></script>
<script>
const W=1280,H=720;
const PIX="'Pixelify Sans',monospace",SILK="'Silkscreen',monospace",SORA="'Sora',sans-serif";
const GOLD='#f6e0a6',DR='#a855f7',DRH='#d8b4fe',BONE='#efe9f4',VOID='#0a0810',WATER='#4a7fa0';
(async()=>{
  const imgs={
    drowned_king:await Reel.loadImg('assets/_reel/drowned_king.png'),
    barrow_lord:await Reel.loadImg('assets/_reel/barrow_lord.png'),
    ash_warlord:await Reel.loadImg('assets/_reel/ash_warlord.png'),
    vista:await Reel.loadImg('assets/landing/hero_vista.svg'),
  };
  // each boss: 6-frame strip [idle0,idle1,atk0,atk1,atk2,atk3]
  const bosses=[
    {key:'drowned_king',fw:110,fh:110,name:'THE DROWNED KING',camp:'Drowned Ruins',tint:'rgba(74,127,160,0.5)'},
    {key:'barrow_lord', fw:110,fh:116,name:'THE BARROW LORD', camp:'Barrow-Crypt', tint:'rgba(216,180,254,0.45)'},
    {key:'ash_warlord', fw:100,fh:110,name:'THE ASH WARLORD', camp:'Ashen Warcamp', tint:'rgba(245,158,11,0.45)'},
  ];
  const SEG=4200, LOOP=SEG*3;
  Reel.makeStage(W,H,LOOP,(ctx,t)=>{
    // backdrop
    ctx.fillStyle=VOID; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=0.5; ctx.imageSmoothingEnabled=false; ctx.drawImage(imgs.vista,0,0,480,270,-20,-30,1320,760); ctx.globalAlpha=1;
    const idx=Math.floor(t/SEG)%3, st=t-idx*SEG, b=bosses[idx];
    // fade between bosses
    const fin=Math.min(1,st/300), fout=Math.min(1,(SEG-st)/300), fade=Math.min(fin,fout);
    // pedestal glow (boss tint)
    const cx=W/2, baseY=H-150;
    ctx.fillStyle=Reel.radial(ctx,cx,baseY-40,260,[[0,b.tint],[0.5,'rgba(107,33,168,0.14)'],[0.78,'rgba(0,0,0,0)']]);
    ctx.globalAlpha=fade; ctx.fillRect(cx-300,baseY-260,600,300); ctx.globalAlpha=1;
    // choose frame: idle swap 0/1 @2fps; attack window 2.6-3.3s plays 2..5
    let col;
    if(st>2600&&st<3300){ col=2+Math.min(3,Math.floor((st-2600)/175)); }
    else { col=(Math.floor(st/500)%2); }
    const bob=Math.round(Math.sin(st/600)*3);
    ctx.globalAlpha=fade;
    Reel.sprBase(ctx,imgs[b.key],b.fw,b.fh,col,cx,baseY+bob,3.0);
    ctx.globalAlpha=1;
    Reel.motes(ctx,W,H,t,34,'#a855f7',7);
    Reel.vignette(ctx,W,H,0.92);
    // header
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillStyle='rgba(216,207,224,0.6)'; ctx.font=`16px ${SILK}`; ctx.fillText('N A E V Y R   ·   B E S T I A R Y',54,58);
    // name card (bottom)
    ctx.globalAlpha=fade; ctx.textAlign='center';
    ctx.fillStyle=GOLD; ctx.font=`700 64px ${PIX}`; ctx.shadowColor='rgba(168,85,247,0.5)'; ctx.shadowBlur=22; ctx.fillText(b.name,W/2,H-62); ctx.shadowBlur=0;
    ctx.fillStyle=DRH; ctx.font=`15px ${SILK}`; ctx.fillText(b.camp.toUpperCase()+'  ·  CAMP MINI-BOSS',W/2,H-34);
    ctx.globalAlpha=1;
    // counter dots
    for(let i=0;i<3;i++){ ctx.fillStyle=i===idx?GOLD:'rgba(216,207,224,0.3)'; ctx.fillRect(W/2-18+i*14,28,8,8); }
  });
})();
</script>
</body></html>
