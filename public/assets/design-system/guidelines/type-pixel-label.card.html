<!-- @dsCard group="Type" viewport="700x200" name="Pixel labels · Silkscreen" subtitle="Crisp bitmap for micro-labels, keybind caps, badges & tags" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); display: flex; flex-direction: column; gap: 16px; }
  .meta { font: 400 10px/1 var(--font-pixel); letter-spacing: .1em; color: var(--text-muted); text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lbl { font-family: var(--font-pixel); text-transform: uppercase; letter-spacing: .1em; color: var(--text-secondary); }
  .key { font-family: var(--font-pixel); font-size: 12px; color: var(--text-primary); background: var(--surface-well); box-shadow: var(--bevel-slot); padding: 5px 8px; }
  .badge { font-family: var(--font-pixel); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--drift-core); background: var(--corrupt-32); box-shadow: 0 0 0 1px var(--corrupt-55); padding: 4px 9px; }
</style>
</head>
<body>
  <div>
    <div class="meta">font-pixel · Silkscreen</div>
    <div class="row" style="margin-top:10px">
      <span class="lbl" style="font-size:16px">INVENTORY</span>
      <span class="lbl" style="font-size:13px">ACTIVITY LOG</span>
      <span class="lbl" style="font-size:11px">XP TO NEXT</span>
    </div>
  </div>
  <div class="row">
    <span class="key">1</span><span class="key">2</span><span class="key">3</span>
    <span class="key">4</span><span class="key">5</span><span class="key">6</span>
    <span class="badge">Season 03 · Ashfall</span>
  </div>
</body>
</html>
