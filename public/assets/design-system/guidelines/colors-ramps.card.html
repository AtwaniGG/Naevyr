<!-- @dsCard group="Colors" viewport="700x300" name="Material ramps" subtitle="Light→shadow ramp per material so every sprite shades the same way" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--bg-app); }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .nm { width: 96px; font: 400 11px/1.3 var(--font-pixel); letter-spacing: .04em; color: var(--text-secondary); text-transform: uppercase; }
  .ramp { display: flex; flex: 1; box-shadow: var(--bevel-slot); }
  .stop { flex: 1; height: 26px; }
</style>
</head>
<body>
  <div id="r"></div>
  <script>
    const ramps = [
      ['grass',   ['#7fae5e','#4d7c4d','#356037','#20402a']],
      ['dirt',    ['#7a6048','#50402e','#36291c','#241a11']],
      ['stone',   ['#4a4360','#322b46','#211c30','#14101e']],
      ['water',   ['#4a7fa0','#2c5775','#173a52','#0d2336']],
      ['the drift',['#f3e8ff','#d8b4fe','#a855f7','#6b21a8','#3b1162']],
      ['ember',   ['#fcd34d','#f59e0b','#b45309','#7c3a06']],
      ['gold',    ['#f6e0a6','#e7c873','#b8943f','#7c5f23']],
      ['blood',   ['#ef4444','#dc2626','#991b1b','#5f1212']],
      ['bone/txt',['#efe9f4','#d8cfe0','#a99fb8','#6f6781']],
    ];
    document.getElementById('r').innerHTML = ramps.map(([n,cs]) =>
      `<div class="row"><span class="nm">${n}</span><div class="ramp">${cs.map(c=>`<div class="stop" style="background:${c}"></div>`).join('')}</div></div>`
    ).join('');
  </script>
</body>
</html>
